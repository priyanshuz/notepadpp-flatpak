name: Build and Publish Flatpak

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:  # allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: notepad-plus-plus.flatpak
          manifest-path: com.notepadplusplus.NotepadPlusPlus.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Build Flatpak repository
        run: |
          dbus-uuidgen --ensure=/etc/machine-id
          flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir com.notepadplusplus.NotepadPlusPlus.yml
          flatpak build-update-repo repo --generate-static-deltas --default-branch=master

      - name: Generate flatpakref
        run: |
          REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/repo"
          cat > com.notepadplusplus.NotepadPlusPlus.flatpakref <<EOF
          [Flatpak Ref]
          Name=com.notepadplusplus.NotepadPlusPlus
          Branch=master
          Title=Notepad++ (Unofficial)
          IsRuntime=false
          Url=${REPO_URL}
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          NoGPGVerify=true
          EOF

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-plus-plus-flatpak
          path: notepad-plus-plus.flatpak
          retention-days: 30

      - name: Upload Flatpak repository as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-plus-plus-repo
          path: repo
          retention-days: 30

      - name: Upload flatpakref as artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad-plus-plus-flatpakref
          path: com.notepadplusplus.NotepadPlusPlus.flatpakref
          retention-days: 30

  publish-repo:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download repo artifact
        uses: actions/download-artifact@v4
        with:
          name: notepad-plus-plus-repo
          path: site/repo

      - name: Download flatpakref artifact
        uses: actions/download-artifact@v4
        with:
          name: notepad-plus-plus-flatpakref
          path: site

      - name: Generate landing page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Notepad++ Flatpak</title>
            <style>
              :root {
                color-scheme: light;
                --bg: #f5f6fa;
                --card: #ffffff;
                --text: #162036;
                --muted: #5a6477;
                --accent: #0b5fff;
                --border: #d8deea;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                font-family: "Segoe UI", "Noto Sans", sans-serif;
                background: radial-gradient(circle at top right, #e8f0ff, var(--bg) 60%);
                color: var(--text);
                display: grid;
                place-items: center;
                padding: 24px;
              }
              main {
                width: min(760px, 100%);
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 28px;
                box-shadow: 0 10px 30px rgba(20, 45, 100, 0.08);
              }
              h1 {
                margin: 0 0 8px;
                font-size: clamp(1.6rem, 3vw, 2.1rem);
              }
              p { margin: 10px 0; color: var(--muted); line-height: 1.5; }
              ul { margin: 18px 0 0; padding-left: 20px; }
              li { margin: 8px 0; }
              a { color: var(--accent); text-decoration: none; }
              a:hover { text-decoration: underline; }
              code {
                background: #eef2fb;
                border-radius: 6px;
                padding: 2px 6px;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Notepad++ Flatpak Repository</h1>
              <p>Unofficial Flatpak package for Notepad++ running on Wine.</p>
              <p>Use the install ref directly:</p>
              <p><a href="./com.notepadplusplus.NotepadPlusPlus.flatpakref">com.notepadplusplus.NotepadPlusPlus.flatpakref</a></p>
              <ul>
                <li>Flatpak remote files: <a href="./repo/">repo/</a></li>
                <li>Install command: <code>flatpak install --user https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/com.notepadplusplus.NotepadPlusPlus.flatpakref</code></li>
              </ul>
            </main>
          </body>
          </html>
          EOF

      - name: Publish to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: notepad-plus-plus-flatpak

      - name: Download flatpakref artifact
        uses: actions/download-artifact@v4
        with:
          name: notepad-plus-plus-flatpakref

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            notepad-plus-plus.flatpak
            com.notepadplusplus.NotepadPlusPlus.flatpakref
            install.sh
          generate_release_notes: true
        env:
          # GITHUB_TOKEN is auto-provided by GitHub Actions — no setup needed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
