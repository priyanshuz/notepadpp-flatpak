app-id: com.notepadplusplus.NotepadPlusPlus
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.winehq.Wine
base-version: stable-24.08
command: notepadplusplus.sh

inherit-extensions:
  - org.freedesktop.Platform.GL32
  - org.freedesktop.Platform.ffmpeg-full
  - org.freedesktop.Platform.ffmpeg_full.i386
  - org.winehq.Wine.gecko
  - org.winehq.Wine.mono

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '24.08'
  org.freedesktop.Platform.GL32.default:
    directory: lib/i386-linux-gnu/GL
    version: '24.08'
    subdirectories: true
    autodelete: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --filesystem=~/.fonts:ro
  - --filesystem=/run/host/fonts:ro
  - --persist=.wine
  - --allow=multiarch
  - --env=WINEPREFIX=/var/data/wine
  - --env=WINEARCH=win64
  - --env=NPP_WINE_DPI=96
  - --env=WINE_DARK_THEME=NO
  - --env=WINEDLLOVERRIDES=winemenubuilder.exe=d
  - --env=FONTCONFIG_PATH=/etc/fonts
  - --env=XDG_DATA_DIRS=/usr/share:/app/share

modules:
  - name: notepadplusplus
    buildsystem: simple
    build-commands:
      # Create directories for 32-bit compat extensions
      - mkdir -p /app/lib/i386-linux-gnu
      - mkdir -p /app/lib/i386-linux-gnu/GL
      # Install launcher script
      - install -Dm755 notepadplusplus.sh /app/bin/notepadplusplus.sh
      # Install desktop file
      - install -Dm644 com.notepadplusplus.NotepadPlusPlus.desktop
          /app/share/applications/com.notepadplusplus.NotepadPlusPlus.desktop
      # Install icon
      - install -Dm644 com.notepadplusplus.NotepadPlusPlus.png
          /app/share/icons/hicolor/256x256/apps/com.notepadplusplus.NotepadPlusPlus.png
      # Install Notepad++ installer and support files
      - install -Dm644 npp-installer.exe
          /app/share/notepadplusplus/npp-installer.exe
      - install -Dm644 dark-mode.reg
          /app/share/notepadplusplus/dark-mode.reg
      - install -Dm644 light-mode.reg
          /app/share/notepadplusplus/light-mode.reg

    sources:
      - type: file
        url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.4/npp.8.9.4.Installer.x64.exe
        sha256: f3629f500d0754d8e870255fff0e00384a37f5402d6f3ad8dd1f4f67d707b593
        dest-filename: npp-installer.exe
      - type: file
        url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.4/npp.8.9.4.Installer.x64.exe.sig
        sha256: 19e8079aa450a32d4fefe890f4622af2ca5faf064e782d78b4ad3abeffc1b104
        dest-filename: npp-installer.exe.sig
      - type: file
        path: notepadplusplus.sh
      - type: file
        path: dark-mode.reg
      - type: file
        path: light-mode.reg
      - type: file
        path: com.notepadplusplus.NotepadPlusPlus.desktop
      - type: file
        path: com.notepadplusplus.NotepadPlusPlus.png
