app-id: com.notepad-plus-plus.NotepadPlusPlus
runtime: org.winehq.Wine
runtime-version: stable-23.08
sdk: org.winehq.Wine//stable-23.08
command: notepadplusplus.sh

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --persist=.wine
  - --env=WINEPREFIX=/var/data/wine
  - --env=WINEARCH=win64

modules:
  - name: notepadplusplus
    buildsystem: simple
    build-commands:
      # Install launcher script
      - install -Dm755 notepadplusplus.sh /app/bin/notepadplusplus.sh
      # Install desktop file
      - install -Dm644 com.notepad-plus-plus.NotepadPlusPlus.desktop
          /app/share/applications/com.notepad-plus-plus.NotepadPlusPlus.desktop
      # Install icon
      - install -Dm644 com.notepad-plus-plus.NotepadPlusPlus.png
          /app/share/icons/hicolor/256x256/apps/com.notepad-plus-plus.NotepadPlusPlus.png
      # Install Notepad++ installer and support files
      - install -Dm644 npp-installer.exe
          /app/share/notepadplusplus/npp-installer.exe
      - install -Dm644 dark-mode.reg
          /app/share/notepadplusplus/dark-mode.reg

    sources:
      - type: file
        url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.4/npp.8.9.4.Installer.x64.exe
        sha256: f3629f500d0754d8e870255fff0e00384a37f5402d6f3ad8dd1f4f67d707b593
        dest-filename: npp-installer.exe
      - type: file
        url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.4/npp.8.9.4.Installer.x64.exe.sig
        sha256: 19e8079aa450a32d4fefe890f4622af2ca5faf064e782d78b4ad3abeffc1b104
        dest-filename: npp-installer.exe.sig
      - type: file
        path: notepadplusplus.sh
      - type: file
        path: dark-mode.reg
      - type: file
        path: com.notepad-plus-plus.NotepadPlusPlus.desktop
      - type: file
        path: com.notepad-plus-plus.NotepadPlusPlus.png
